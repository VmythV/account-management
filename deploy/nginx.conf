server {
    listen 80;
    listen [::]:80;
    server_name account-archive.service.ai-builder.world;

    location ^~ /.well-known/acme-challenge/ {
        root /data/service/certbot/data/webroot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 308 https://account-archive.service.ai-builder.world$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name account-archive.service.ai-builder.world;
    ssl_certificate /data/service/certbot/config/domains/live/account-archive.service.ai-builder.world/fullchain.pem;
    ssl_certificate_key /data/service/certbot/config/domains/live/account-archive.service.ai-builder.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 64k;
    access_log /data/service/account-archive/logs/nginx/account-archive.access.log main;
    error_log /data/service/account-archive/logs/nginx/account-archive.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:23005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_read_timeout 30s;
    }
}
